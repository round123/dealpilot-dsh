name: Build & Publish DealPilot Plugin

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: dealpilot-build-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: plugin

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: plugin

      - name: Compile TypeScript
        run: pnpm exec tsc
        working-directory: plugin

      - name: Verify clean plugin install
        shell: bash
        run: |
          verify_dir="$RUNNER_TEMP/dealpilot-dsh-install-check"
          mkdir -p "$verify_dir/lib"
          cp plugin/package.json plugin/pnpm-lock.yaml plugin/.npmrc "$verify_dir/"
          cp plugin/lib/okf-utils.js plugin/lib/workspace-manager.js plugin/lib/workspace-context.js "$verify_dir/lib/"
          pnpm install --prod --frozen-lockfile --ignore-scripts --dir "$verify_dir"
          (cd "$verify_dir" && node --input-type=module -e "import('./lib/okf-utils.js').then(() => console.log('standalone plugin import OK'))")

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Assemble distributable
        shell: bash
        run: |
          dist_dir="$RUNNER_TEMP/dealpilot-dsh"
          mkdir -p "$dist_dir/lib" "$dist_dir/client"

          cp plugin/package.json "$dist_dir/"
          cp plugin/.npmrc "$dist_dir/"
          cp plugin/cordis.patch.yml "$dist_dir/"
          cp plugin/pnpm-lock.yaml "$dist_dir/"
          cp README.md "$dist_dir/"
          cp plugin/lib/*.js "$dist_dir/lib/"
          cp plugin/client/client.js "$dist_dir/client/"
          cp plugin/client/dashboard.html "$dist_dir/client/"
          cp plugin/client/dealpilot-shell.html "$dist_dir/client/"
          cp -R plugin/agent-preset "$dist_dir/agent-preset"

          short_sha="${GITHUB_SHA:0:7}"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/dealpilot-dsh-$short_sha.tar.gz" dealpilot-dsh
          cd "$RUNNER_TEMP"
          zip -qr "dealpilot-dsh-$short_sha.zip" dealpilot-dsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dealpilot-dsh-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dealpilot-dsh-*.tar.gz
            ${{ runner.temp }}/dealpilot-dsh-*.zip
          if-no-files-found: error

      - name: Publish to dist branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          # Rebuild dist as a clean, directly installable plugin branch.
          git checkout --orphan dist
          git rm -rf .
          cp -R "$RUNNER_TEMP/dealpilot-dsh/." .

          git add README.md package.json .npmrc pnpm-lock.yaml cordis.patch.yml lib client agent-preset
          git commit -m "build: ${GITHUB_SHA}"
          git push -f origin HEAD:dist
