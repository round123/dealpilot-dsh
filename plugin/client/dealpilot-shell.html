<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DealPilot</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202124;background:#f7f8fa;letter-spacing:0}
    button,select{font:inherit}.shell{height:100%;display:grid;grid-template-columns:250px minmax(520px,1fr) 330px;overflow:hidden}.shell.inspector-closed{grid-template-columns:250px minmax(520px,1fr)}.shell.inspector-closed .inspector{display:none}
    .rail,.inspector{background:#fff;min-width:0}.rail{border-right:1px solid #e3e6ea;padding:18px 14px;display:flex;flex-direction:column;gap:16px}.inspector{border-left:1px solid #e3e6ea;overflow:auto}
    .brand{display:flex;align-items:center;gap:10px;padding:0 4px}.mark{width:30px;height:30px;border-radius:6px;background:#16181d;color:#fff;display:grid;place-items:center;font-weight:700}.brand strong{font-size:15px}.brand small{display:block;color:#747982;margin-top:2px}
    .label{display:block;font-size:11px;color:#737982;margin:0 0 7px;text-transform:uppercase}.select{width:100%;height:38px;border:1px solid #d9dde3;border-radius:6px;background:#fff;padding:0 9px;color:#25282d}
    .status{border-left:3px solid #a9afb8;padding:8px 10px;background:#f6f7f8;font-size:12px;line-height:1.5}.status.ready{border-color:#16835b;background:#eef8f4}.status.new{border-color:#c17c00;background:#fff8e8}.status.invalid{border-color:#c43c35;background:#fff1f0}
    .primary{height:36px;border:0;border-radius:6px;background:#1769e0;color:#fff;padding:0 12px;cursor:pointer}.primary[hidden]{display:none}.primary:disabled{opacity:.5;cursor:wait}
    .workspace-meta{margin-top:auto;border-top:1px solid #eceef1;padding-top:12px;font-size:12px;color:#737982}.home{color:#394150;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:7px 4px}
    .conversation{min-width:0;height:100%;background:#fff;display:grid;grid-template-rows:48px 1fr}.conversation-toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #e6e8eb;background:#fff}.conversation-toolbar strong{font-size:13px}.conversation-toolbar small{color:#747982;margin-left:8px}.toolbar-actions{display:flex;gap:6px}.toolbar-button{height:30px;border:1px solid #dce0e5;background:#fff;border-radius:6px;padding:0 9px;color:#4c5561;cursor:pointer;font-size:12px}.toolbar-button:hover,.refresh:hover{background:#f5f7f9}.conversation iframe{width:100%;height:100%;border:0;display:block}
    .panel-head{height:58px;padding:0 16px;border-bottom:1px solid #e6e8eb;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:2}.panel-head h2{font-size:14px;margin:0}.panel-actions{display:flex;gap:6px}.refresh,.close-inspector{width:30px;height:30px;border:1px solid #dce0e5;background:#fff;border-radius:6px;cursor:pointer;font-size:16px}.close-inspector{font-size:18px;color:#626a75}.refresh:hover,.close-inspector:hover{background:#f5f7f9}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #e6e8eb}.tab{height:38px;border:0;background:#fff;color:#6c727b;font-size:12px;cursor:pointer}.tab.active{color:#1769e0;border-bottom:2px solid #1769e0;font-weight:600}
    .content{padding:12px}.empty{padding:38px 12px;text-align:center;color:#8a9099;font-size:13px}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}.metric div{border:1px solid #e3e6ea;border-radius:6px;padding:9px}.metric b{display:block;font-size:18px}.metric span{font-size:10px;color:#7a8088}
    .item{width:100%;text-align:left;border:1px solid #e1e4e8;background:#fff;border-radius:6px;padding:10px;margin-bottom:7px;cursor:pointer}.item:hover{border-color:#9ab8e7;background:#f7faff}.item strong{font-size:13px;display:block;margin-bottom:5px}.item p{margin:0;color:#737982;font-size:11px;line-height:1.45}.badge{display:inline-block;font-size:10px;padding:2px 5px;border-radius:4px;background:#eef1f4;color:#59616b;margin-right:4px}.badge.risk{background:#fff0e4;color:#a94d00}.detail{position:fixed;right:0;top:0;height:100%;width:min(430px,90vw);background:#fff;border-left:1px solid #dfe3e8;box-shadow:-8px 0 28px rgba(0,0,0,.12);z-index:10;padding:18px;overflow:auto}.detail[hidden]{display:none}.detail-close{float:right;width:30px;height:30px;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer}.detail h3{font-size:18px;margin:40px 0 8px}.detail pre{white-space:pre-wrap;font:12px/1.6 ui-monospace,SFMono-Regular,monospace;background:#f5f6f7;padding:12px;border-radius:6px}
    @media(max-width:1000px){.shell{grid-template-columns:210px 1fr}.shell.inspector-closed{grid-template-columns:210px 1fr}.inspector{display:none}.inspector.open{display:block;position:fixed;right:0;top:0;width:min(360px,88vw);height:100%;z-index:8;box-shadow:-8px 0 24px rgba(0,0,0,.14)}}@media(max-width:700px){.shell,.shell.inspector-closed{grid-template-columns:1fr;grid-template-rows:auto 1fr}.rail{padding:10px;border-right:0;border-bottom:1px solid #ddd}.brand,.workspace-meta{display:none}.rail>div{display:grid;grid-template-columns:1fr auto;gap:8px}.label,.status{grid-column:1/-1}.conversation{min-height:0}.conversation-toolbar{padding:0 10px}.conversation-toolbar small{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <aside class="rail" aria-label="DealPilot workspace">
      <div class="brand"><span class="mark">D</span><div><strong>DealPilot</strong><small>Sales workspace</small></div></div>
      <div>
        <label class="label" for="workspace">Workspace</label>
        <select class="select" id="workspace"><option value="">加载中...</option></select>
        <div class="status" id="workspace-status">请选择 Workspace</div>
        <button class="primary" id="initialize" hidden>初始化 DealPilot</button>
      </div>
      <div class="workspace-meta"><a class="home" href="/">返回默认对话</a><p id="workspace-name">未绑定 Workspace</p></div>
    </aside>
    <section class="conversation" aria-label="DSH conversation"><header class="conversation-toolbar"><div><strong>对话</strong><small id="conversation-workspace">未绑定 Workspace</small></div><div class="toolbar-actions"><button class="toolbar-button" id="reload-conversation" title="重新加载对话">刷新</button><button class="toolbar-button" id="toggle-inspector" title="打开业务上下文">业务</button></div></header><iframe id="dsh-conversation" src="/" title="DeepSeek Harness conversation"></iframe></section>
    <aside class="inspector" id="business-panel" aria-label="DealPilot business views">
      <header class="panel-head"><h2>业务上下文</h2><div class="panel-actions"><button class="refresh" id="refresh" title="刷新">&#8635;</button><button class="close-inspector" id="close-inspector" title="关闭业务上下文" aria-label="关闭业务上下文">×</button></div></header>
      <nav class="tabs"><button class="tab active" data-view="deals">Deals</button><button class="tab" data-view="customers">客户</button><button class="tab" data-view="actions">任务</button></nav>
      <div class="content" id="business-content"><div class="empty">选择 Workspace 后加载业务数据</div></div>
    </aside>
  </main>
  <section class="detail" id="detail" hidden><button class="detail-close" id="detail-close" aria-label="关闭">×</button><div id="detail-body"></div></section>
  <script>
    const state={workspaceId:'',inspection:null,snapshot:null,view:'deals'};
    const el=id=>document.getElementById(id);
    async function api(url,options){const res=await fetch(url,options);const data=await res.json();if(!res.ok)throw new Error(data.error||('HTTP '+res.status));return data}
    async function loadWorkspaces(){try{const data=await api('/api/dealpilot/workspaces');const select=el('workspace');select.innerHTML='<option value="">选择 Workspace</option>'+data.workspaces.map(w=>`<option value="${escapeHtml(w.id)}">${escapeHtml(w.name)}</option>`).join('');const saved=sessionStorage.getItem('dealpilot.workspaceId');if(saved&&data.workspaces.some(w=>w.id===saved)){select.value=saved;await selectWorkspace(saved)}}catch(err){setStatus('invalid','Workspace 加载失败：'+err.message)}}
    async function selectWorkspace(id){state.workspaceId=id;state.snapshot=null;render();el('conversation-workspace').textContent='检测 Workspace...';if(!id){setStatus('','请选择 Workspace');el('conversation-workspace').textContent='未绑定 Workspace';return}sessionStorage.setItem('dealpilot.workspaceId',id);setStatus('','检测中...');try{state.inspection=await api('/api/dealpilot/workspaces/inspect',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({workspaceId:id})});if(state.inspection.status==='new'){setStatus('new','这是新的 Workspace，需要初始化 DealPilot。');el('initialize').hidden=false}else{setStatus('ready','已检测到 DealPilot 数据，正在复用。');el('initialize').hidden=true;await loadSnapshot()}el('workspace-name').textContent=state.inspection.name;el('conversation-workspace').textContent=state.inspection.name}catch(err){setStatus('invalid',err.message);el('conversation-workspace').textContent='Workspace 不可用'}}
    async function initialize(){const button=el('initialize');button.disabled=true;setStatus('','初始化中...');try{await api('/api/dealpilot/workspaces/initialize',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({workspaceId:state.workspaceId})});button.hidden=true;setStatus('ready','Workspace 已就绪。');await loadSnapshot()}catch(err){setStatus('invalid',err.message)}finally{button.disabled=false}}
    async function loadSnapshot(){if(!state.workspaceId)return;try{state.snapshot=await api('/api/dealpilot/snapshot?workspaceId='+encodeURIComponent(state.workspaceId));render()}catch(err){el('business-content').innerHTML=`<div class="empty">${escapeHtml(err.message)}</div>`}}
    function setStatus(kind,text){const box=el('workspace-status');box.className='status '+kind;box.textContent=text}
    function render(){const root=el('business-content'),s=state.snapshot;if(!s){root.innerHTML='<div class="empty">暂无业务数据</div>';return}const metrics=`<div class="metric"><div><b>${s.summary.active_deals}</b><span>活跃交易</span></div><div><b>${s.summary.customers}</b><span>客户</span></div><div><b>${s.summary.today}</b><span>待办</span></div></div>`;let items=[];if(state.view==='deals')items=s.deals.map(x=>({title:x.title,meta:`${x.customer_name} · ${x.funnel_stage}`,badges:[x.priority,x.risk_level],data:x}));if(state.view==='customers')items=s.customers.map(x=>({title:x.title,meta:`${x.relationship_stage} · ${x.source_category}`,badges:[x.priority,x.icp_fit],data:x}));if(state.view==='actions')items=s.today.map(x=>({title:x.title,meta:`${x.customer_name} · ${x.due_at||'未设置日期'}`,badges:[x.priority,x.bucket],data:x}));root.innerHTML=metrics+(items.length?items.map((x,i)=>`<button class="item" data-index="${i}"><strong>${escapeHtml(x.title)}</strong><p>${x.badges.map(b=>`<span class="badge ${b==='high'?'risk':''}">${escapeHtml(b||'-')}</span>`).join('')} ${escapeHtml(x.meta)}</p></button>`).join(''):'<div class="empty">没有数据</div>');root.querySelectorAll('.item').forEach(node=>node.onclick=()=>showDetail(items[Number(node.dataset.index)].data))}
    function showDetail(data){el('detail-body').innerHTML=`<h3>${escapeHtml(data.title||'详情')}</h3><pre>${escapeHtml(JSON.stringify(data,null,2))}</pre>`;el('detail').hidden=false}
    function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function setInspectorOpen(open){el('business-panel').classList.toggle('open',open);document.querySelector('.shell').classList.toggle('inspector-closed',!open);el('toggle-inspector').textContent=open?'隐藏业务':'业务'}
    el('workspace').onchange=e=>selectWorkspace(e.target.value);el('initialize').onclick=initialize;el('refresh').onclick=loadSnapshot;el('reload-conversation').onclick=()=>el('dsh-conversation').contentWindow.location.reload();el('toggle-inspector').onclick=()=>setInspectorOpen(document.querySelector('.shell').classList.contains('inspector-closed'));el('close-inspector').onclick=()=>setInspectorOpen(false);el('detail-close').onclick=()=>el('detail').hidden=true;document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active');state.view=tab.dataset.view;render()});setInspectorOpen(true);loadWorkspaces();
  </script>
</body>
</html>
